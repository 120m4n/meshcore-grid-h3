services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Bind mount (no volumen anónimo): el .db queda accesible directo
      # en el host para respaldos o inspección directa (sqlite3 CLI).
      - ./data:/data
    environment:
      PORT: "8080"
      DB_PATH: /data/meshcore.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      H3_RESOLUTION: ${H3_RESOLUTION:-8}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081}
      # TEMPORAL: apunta a la API DEM de pruebas en el host (Docker
      # Desktop en Mac resuelve host.docker.internal al host sin config
      # extra). Reemplazar por el endpoint DEM real antes de producción
      # — ver docker-compose.prod.yml, que todavía no expone esta var.
      DEM_API_URL: ${DEM_API_URL:-http://host.docker.internal:8000}
      # TEMPORAL: 40 calibrado empíricamente contra la API DEM de pruebas
      # (no es un límite de concurrencia — ráfagas aisladas de 100-150
      # pasan igual — es una ventana de tiempo/tasa sostenida: 40 req/s
      # sostuvo 1441 y 2881 llamadas seguidas sin 429, 80 req/s falló a
      # los ~17s). Recalibrar si el rate limit real del lado del DEM
      # cambia — 0 = sin límite.
      DEM_MAX_REQUESTS_PER_SEC: ${DEM_MAX_REQUESTS_PER_SEC:-40}
      # Rate limits de la propia API (no del DEM) — antes hardcodeados
      # en router.go, ahora configurables sin rebuild. Ver
      # infra/.env.example para el detalle de qué protege cada uno.
      GENERAL_RATE_LIMIT_PER_HOUR: ${GENERAL_RATE_LIMIT_PER_HOUR:-300}
      GENERAL_RATE_LIMIT_BURST: ${GENERAL_RATE_LIMIT_BURST:-60}
      AUTH_RATE_LIMIT_PER_HOUR: ${AUTH_RATE_LIMIT_PER_HOUR:-10}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-5}
      SIMULATIONS_RATE_LIMIT_PER_HOUR: ${SIMULATIONS_RATE_LIMIT_PER_HOUR:-30}
      SIMULATIONS_RATE_LIMIT_BURST: ${SIMULATIONS_RATE_LIMIT_BURST:-3}
      TZ: America/Bogota

  web:
    build:
      context: ../apps/web
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api
    environment:
      TZ: America/Bogota

networks:
  default:
    name: meshcore-net
    external: false
